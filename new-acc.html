<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new account</title>
    <link rel="stylesheet" href="paypal.css">
</head>
<body class="body-acc">
     <img src="paypal.webp" alt="">
        <form action="" id="form-acc">
            <fieldset class="field-acc">
                <legend class="paypal-legend">Paypal form</legend>
                    <label for="FirstName">Firstname:</label>
                    <input type="text" name="firstName"  placeholder=" Firstname"required><br>

                    <br><label for="Lastname">Lastname:</label>
                    <input type="text" name="Lastname" placeholder="Lastname"required><br><br>

                    <label for="Email">Email:</label>
                    <input type="email" name="Email" placeholder="Email" required><br><br>

                    <label for="password">Password:</label>
                    <input type="password" name="password" placeholder="Email password"required><br><br>

                    <label for="Phone number">Phone number:</label>
                    <input type="tel" name="Phone number" placeholder="+1(234)567-890" required><br><br>

                    <label for="Gender">Gender:</label>
                    <input type="radio" name="gender" value="Male" required>Male <br><br>
                    <input type="radio" name="gender" value="Female" required> Female <br><br>

                    <input type="submit" id="submit">
                
            </fieldset>
        </form> 
        <p class="new-acc-a">
            <a href="paypal.html" target="_blank">click to return to our home page </a>
        </p>
    </body>
</html>
